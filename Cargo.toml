[workspace]

[package]
name = "vibestats"
version = "2.4.5"
edition = "2021"
description = "CLI that syncs Claude Code and Codex session activity to a private GitHub repo and renders a profile heatmap + analytics dashboard."
license = "MIT"
repository = "https://github.com/stephenleo/vibestats"
homepage = "https://vibestats.dev"
readme = "README.md"
keywords = ["claude-code", "codex", "analytics", "github-action", "heatmap"]
categories = ["command-line-utilities", "development-tools"]
# Whitelist what ships to crates.io. The repo also hosts the GitHub Action
# (action.yml + action/), the dashboard site (site/), and planning artifacts
# (_bmad-output, docs/) — none of which are needed by consumers of the crate.
include = [
    "/src/**/*",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.10"
# Same TLS stack ureq already bundles; used directly only to add the roots from
# SSL_CERT_FILE (Claude Code cloud sessions sit behind a TLS-intercepting proxy).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "0.26"
toml = "0.8"
